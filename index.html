<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="72 Stunden">
<meta name="theme-color" content="#1a060d">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<title>72 Stunden</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff1ee;--glow1:#ff9bb0;--glow2:#ffcf9e;--card:rgba(255,255,255,.72);--text:#3b1019;--muted:#97606a;--line:rgba(160,20,50,.18);--ok:#c98a2b;--warn:#e0701f;--bad:#d4203f;--accent:#b3122f;--accent2:#e8456b;--gold:#b9812a;--face1:#a8143a;--face2:#4a0716;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0206;--glow1:#8c0f2e;--glow2:#c2622a;--card:rgba(40,6,16,.62);--text:#fff0ee;--muted:#d29aa6;--line:rgba(232,180,110,.25);--ok:#f2c078;--warn:#ff9a4d;--bad:#ff4766;--accent:#d6194a;--accent2:#ff6b8f;--gold:#f2c078;--face1:#b01640;--face2:#3d0513;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0206;--glow1:#8c0f2e;--glow2:#c2622a;--card:rgba(40,6,16,.62);--text:#fff0ee;--muted:#d29aa6;--line:rgba(232,180,110,.25);--ok:#f2c078;--warn:#ff9a4d;--bad:#ff4766;--accent:#d6194a;--accent2:#ff6b8f;--gold:#f2c078;--face1:#b01640;--face2:#3d0513;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-10%;background:radial-gradient(circle at 20% 15%,var(--glow1),transparent 50%),radial-gradient(circle at 85% 95%,var(--glow2),transparent 45%);opacity:.7;filter:blur(36px);z-index:0;pointer-events:none}
.petal{position:fixed;top:-30px;z-index:0;pointer-events:none;width:12px;height:16px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,var(--accent2),var(--face1));opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left))}
header{text-align:center;margin:4px 0 14px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:34px;font-style:italic;letter-spacing:.5px;text-shadow:0 0 18px var(--accent2)}
h1 em{color:var(--gold)}
.tag{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(214,25,74,.22),inset 0 1px 0 rgba(255,255,255,.08)}
.ringwrap{position:relative;width:200px;height:200px;margin:0 auto}
#arc{filter:drop-shadow(0 0 7px currentColor);transition:stroke-dashoffset .6s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.k{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.big{font-size:38px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:600;color:var(--muted);margin:0 4px 0 2px}
.meta{text-align:center;font-size:13px;color:var(--muted);margin:8px 0 12px}
.meta b{display:block;font-size:15px;color:var(--text);margin-bottom:1px}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:13px 10px;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
button.p{width:100%;border:0;color:#fff;font-size:16px;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(232,51,95,.35)}
.dice{display:grid;grid-template-columns:100px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.scene{perspective:600px;width:100px;height:100px}
.cube{position:relative;width:100px;height:100px;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.2,.8,.25,1)}
.face{position:absolute;width:100px;height:100px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;backface-visibility:hidden;background:linear-gradient(145deg,var(--face1),var(--face2));box-shadow:inset 0 0 0 2px var(--gold),inset 0 -10px 20px rgba(0,0,0,.35),0 0 18px rgba(214,25,74,.45)}
.f1{transform:rotateY(0) translateZ(50px)}.f2{transform:rotateY(180deg) translateZ(50px)}.f3{transform:rotateY(90deg) translateZ(50px)}.f4{transform:rotateY(-90deg) translateZ(50px)}.f5{transform:rotateX(90deg) translateZ(50px)}.f6{transform:rotateX(-90deg) translateZ(50px)}
.rt{font-family:Georgia,serif;font-style:italic;font-size:23px;font-weight:700;color:var(--gold);line-height:1.15}
.lead{display:inline-block;margin-top:6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:99px;padding:3px 10px}
.rd{font-size:13px;color:var(--muted);margin-top:3px}
.tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.tm.end{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
summary{padding:12px 0;font-weight:600;color:var(--muted);cursor:pointer;list-style:none;text-align:center}
summary::-webkit-details-marker{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding-bottom:8px}
.stats b{display:block;font-size:22px;color:var(--accent2)}
.stats span{font-size:11px;color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.item .t{display:block;color:var(--muted);font-size:12px}
.x{border:0;background:none;padding:4px 8px;color:var(--muted)}
.hide{display:none}
</style>
</head>
<body>
<main>
<header><h1>72 <em>Stunden</em></h1><div class="tag">💋 Nur wir zwei 💋</div></header>

<div class="card">
  <div class="ringwrap">
    <svg width="200" height="200" viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="104" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle id="arc" cx="120" cy="120" r="104" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" transform="rotate(-90 120 120)" stroke-dasharray="653.45" stroke-dashoffset="0" style="color:var(--ok)"/>
    </svg>
    <div class="center"><div class="k" id="lbl">noch</div><div class="big" id="time">72<small>h</small></div></div>
  </div>
  <div class="meta"><b id="status">Noch nicht gestartet</b><span id="ends">&nbsp;</span></div>
  <button class="p" id="start72">▶ 72 Stunden starten</button>
</div>

<div class="card">
  <div class="dice">
    <div class="scene"><div class="cube" id="cube">
      <div class="face f1">💆</div><div class="face f2">💋</div><div class="face f3">👗</div>
      <div class="face f4">🛁</div><div class="face f5">🎀</div><div class="face f6">🔥</div>
    </div></div>
    <div>
      <div class="rt" id="rt">Trau dich …</div>
      <div class="rd" id="rd">Was fällt, wird gemacht.</div>
      <div class="lead hide" id="lead"></div>
      <div class="tm hide" id="tm">10:00</div>
    </div>
  </div>
  <button class="p" id="roll">🎲 Würfeln, wenn du dich traust</button>
  <div class="row hide" id="after">
    <button id="tstart">⏱ Timer</button>
    <button id="done">😘 Erledigt</button>
  </div>
</div>

<details>
  <summary>Verlauf &amp; Bilanz</summary>
  <div class="stats">
    <div><b id="s1">–</b><span>eingehalten</span></div>
    <div><b id="s2">–</b><span>längste Pause</span></div>
    <div><b id="s3">–</b><span>Momente</span></div>
  </div>
  <div id="log"></div>
</details>
</main>
<script>
const KEY='72h-entries';
const DICE=[
 ['💆','Massage','10 Min. pro Person. Öl, Kerzen, langsam.','Massage',10],
 ['💋','Küssen','Lang, tief, ohne Eile. Hände dürfen wandern.','Kuss',5],
 ['👗','Verführen','Einer zieht den anderen langsam aus.','Verführung',15],
 ['🛁','Dusche / Bad','Zusammen. Warmes Wasser, Hände überall.','Dusche / Bad',30],
 ['🎀','Augenbinde','Einer verbindet die Augen, der andere führt.','Augenbinde',15],
 ['🔥','Ganz intim','Heute Nacht. Nehmt euch alle Zeit.','Intimität',45]
];
const ICONS={'Massage':'💆','Kuscheln':'🤗','Kuss':'💋','Verführung':'👗','Augenbinde':'🎀','Dusche / Bad':'🛁','Date / Zeit zu zweit':'🍷','Intimität':'🔥','Anderes':'✨'};
const H=3600000,LIM=72*H;
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
let entries=load().sort((a,b)=>a.t-b.t);
function dt(t){return new Date(t).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function add(type,note){entries.push({id:Date.now(),t:Date.now(),type:type,note:note||''});entries.sort((a,b)=>a.t-b.t);save(entries);render()}
function render(){
  const now=Date.now(),arc=$('arc'),C=653.45;
  if(!entries.length){
    $('time').innerHTML='72:00:00';$('lbl').textContent='noch';
    $('status').textContent='Noch nicht gestartet';$('ends').innerHTML='&nbsp;';arc.style.strokeDashoffset=0;
  }else{
    const last=entries[entries.length-1].t,rem=LIM-(now-last),a=Math.abs(rem);
    const h=Math.floor(a/H),m=Math.floor(a%H/60000),sc=Math.floor(a%60000/1000);
    const col=rem<12*H?'var(--bad)':rem<36*H?'var(--warn)':'var(--ok)';
    arc.style.color=col;arc.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,rem/LIM)));
    $('lbl').textContent=rem<0?'überfällig':'noch';
    $('time').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
    $('status').textContent=rem<0?'Überfällig. Heute Abend nachholen. 🔥':rem<12*H?'Heute wird es Zeit. 😏':rem<36*H?'Plant etwas Schönes.':'Alles im Rahmen.';
    $('status').style.color=col;
    $('ends').textContent='Ablauf: '+dt(last+LIM);
  }
  $('start72').textContent=entries.length?'↺ Neu starten':'▶ 72 Stunden starten';
  const cut=now-30*24*H,rec=entries.filter(e=>e.t>=cut);
  const pts=[...entries.filter(e=>e.t<cut).slice(-1),...rec];
  let ok=0,tot=0,max=0;
  for(let i=1;i<pts.length;i++){const g=pts[i].t-pts[i-1].t;tot++;if(g<=LIM)ok++;max=Math.max(max,g)}
  if(entries.length){const g=now-entries[entries.length-1].t;if(g>LIM){tot++;max=Math.max(max,g)}}
  $('s1').textContent=tot?Math.round(ok/tot*100)+'%':'–';
  $('s2').textContent=max?Math.round(max/H)+'h':'–';
  $('s3').textContent=rec.length;
  const sig=entries.map(e=>e.id).join();if(sig===window._sig)return;window._sig=sig;const log=$('log');log.innerHTML='';
  [...entries].reverse().slice(0,15).forEach(e=>{
    const d=document.createElement('div');d.className='item';
    const l=document.createElement('div');
    l.textContent=(ICONS[e.type]||'✨')+' '+e.type;
    const s=document.createElement('span');s.className='t';s.textContent=dt(e.t)+(e.note?' · '+e.note:'');l.append(s);
    const b=document.createElement('button');b.className='x';b.textContent='✕';b.onclick=()=>{entries=entries.filter(x=>x.id!==e.id);save(entries);render()};
    d.append(l,b);log.append(d);
  });
}
$('start72').onclick=()=>{if(entries.length&&!confirm('Timer jetzt neu auf 72 Stunden setzen?'))return;add('Anderes','Start')};

// Würfel
const ANG=[[0,0],[0,180],[0,-90],[0,90],[-90,0],[90,0]];
let spin=0,cur=null,rolling=false;
function roll(){
  if(rolling)return;rolling=true;tStop();
  $('after').classList.add('hide');$('tm').classList.add('hide');$('lead').classList.add('hide');
  $('rt').textContent='Es rollt …';$('rd').textContent='';
  cur=Math.floor(Math.random()*6);spin++;
  const[x,y]=ANG[cur];
  $('cube').style.transform='rotateX('+(x-720*spin)+'deg) rotateY('+(y-720*spin)+'deg)';
  setTimeout(()=>{
    const d=DICE[cur];
    $('rt').textContent=d[1];$('rd').textContent=d[2];$('lead').textContent=Math.random()<.5?'💃 Sie führt':'🕺 Er führt';$('lead').classList.remove('hide');
    tSet=d[4]*60;tLeft=tSet;tShow();$('tm').classList.remove('hide');
    $('tstart').textContent='⏱ Timer';
    $('after').classList.remove('hide');$('roll').textContent='🎲 Nochmal würfeln';
    rolling=false;
  },1700);
}
$('roll').onclick=roll;
$('done').onclick=()=>{
  tStop();add(DICE[cur][3],'Gewürfelt');
  $('after').classList.add('hide');$('tm').classList.add('hide');$('lead').classList.add('hide');
  $('rt').textContent='Eingetragen ✔';$('rd').textContent='Der Countdown läuft neu. 😘';$('roll').textContent='🎲 Würfeln, wenn du dich traust';
};

// Timer
let tSet=600,tLeft=600,tEnd=0,tRun=null,actx=null,wl=null;
function tShow(){const s=Math.ceil(tLeft);const el=$('tm');el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el.classList.toggle('end',tLeft<=0)}
function tBeep(){try{const a=actx;if(!a)throw 0;[0,.35,.7].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.3);o.start(a.currentTime+d);o.stop(a.currentTime+d+.3)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
function tStop(){if(wl){try{wl.release()}catch(e){}wl=null}if(tRun){clearInterval(tRun);tRun=null}}
function tTick(){tLeft=(tEnd-Date.now())/1000;if(tLeft<=0){tLeft=0;tStop();tShow();tBeep();$('tstart').textContent='⏱ Nochmal'}else tShow()}
$('tstart').onclick=()=>{
  if(tRun){tTick();tStop();$('tstart').textContent='▶ Weiter';return}
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>{})}catch(e){}
  if(tLeft<=0)tLeft=tSet;
  tEnd=Date.now()+tLeft*1000;tRun=setInterval(tTick,250);$('tstart').textContent='⏸ Pause';tTick();
};
for(let i=0;i<12;i++){const p=document.createElement('div');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.setProperty('--dx',(Math.random()*120-60)+'px');p.style.animationDuration=(12+Math.random()*14)+'s';p.style.animationDelay=(-Math.random()*20)+'s';p.style.transform='scale('+(.6+Math.random()*.9)+')';document.body.appendChild(p)}
render();setInterval(render,1000);
</script>
</body>
</html>
